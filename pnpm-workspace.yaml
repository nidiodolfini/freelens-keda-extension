allowBuilds:
  '@parcel/watcher': false
  electron: false
  esbuild: false
  node-pty: false

engineStrict: true

# pnpm 11 reads only auth/registry settings from .npmrc; every other setting
# belongs here. The locations below keep the pnpm store and cache inside the
# workspace, which the development sandbox requires (the same values are
# mirrored in .npmrc for tooling that still reads it). `stateDir` cannot be
# set at project level in pnpm 11; the sandbox keeps the state inside the
# workspace by redirecting LOCALAPPDATA.
storeDir: .pnpm-store
cacheDir: .pnpm-cache
autoInstallPeers: true

# Hoisted layout: keeps every dependency flat under node_modules/.
nodeLinker: hoisted

# pnpm holds back any version younger than minimumReleaseAge (1 day by
# default). @freelensapp/extensions is a version range adopted from the
# fluxcd extension, which is often updated on the day it is published.
minimumReleaseAgeExclude:
  - '@freelensapp/extensions'

shellEmulator: true
