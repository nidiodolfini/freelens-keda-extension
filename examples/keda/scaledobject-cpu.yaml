apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: example-app-cpu
  namespace: default
spec:
  scaleTargetRef:
    kind: Deployment
    name: example-app
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "50"
